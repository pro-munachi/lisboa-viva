# Manual review environment. Select this path when creating a new Blueprint.
# Confirm these names do not identify existing services before the first sync.
services:
  - type: web
    name: roam-review-auth
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/pro-munachi/lisboa-viva
    branch: feat/arrival-and-city-experience
    autoDeployTrigger: "off"
    dockerContext: .
    dockerfilePath: ./services/game/Dockerfile
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roam-review-db
          property: connectionString
      - key: PROJECT_ROOT
        value: /app
      - key: LISTEN_ADDR
        value: 0.0.0.0:8080
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_URL
        fromService:
          type: web
          name: roam-review-auth
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: roam-review-web
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/pro-munachi/lisboa-viva
    branch: feat/arrival-and-city-experience
    autoDeployTrigger: "off"
    dockerContext: .
    dockerfilePath: ./apps/web/Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: roam-review-auth
          envVarKey: PUBLIC_URL

databases:
  - name: roam-review-db
    plan: free
    region: frankfurt
    ipAllowList: []
