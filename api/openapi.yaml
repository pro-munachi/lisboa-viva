openapi: 3.1.0
info:
  title: Lisboa Viva Account and Multiplayer API
  version: 0.3.0
servers:
  - url: /api
paths:
  /auth/register:
    post:
      summary: Create an adult tourist or local account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Register"
      responses:
        "201":
          description: Registered and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      summary: Create a session with handle/email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: Revoke the current session
      responses:
        "200":
          description: Signed out
  /auth/me:
    get:
      summary: Return the current account
      security: [{ session: [] }]
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Error" }
    patch:
      summary: Change user type or locale
      security: [{ session: [] }]
      responses:
        "200":
          description: Updated account
  /auth/appearance:
    patch:
      summary: Replace the current player's saved appearance
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Appearance"
      responses:
        "200":
          description: Updated account and appearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /admin/users:
    get:
      summary: List account summaries
      security: [{ session: [] }]
      responses:
        "200": { description: Admin-authorized account list }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /multiplayer/presence:
    put:
      summary: Publish the current in-world player location
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Presence"
      responses:
        "200": { description: Presence heartbeat accepted }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      summary: Leave multiplayer presence
      security: [{ session: [] }]
      responses:
        "200": { description: Presence removed }
        "401": { $ref: "#/components/responses/Error" }
  /multiplayer/nearby:
    get:
      summary: List active players near an in-world coordinate
      security: [{ session: [] }]
      parameters:
        - {
            in: query,
            name: latitude,
            required: true,
            schema: { type: number },
          }
        - {
            in: query,
            name: longitude,
            required: true,
            schema: { type: number },
          }
        - {
            in: query,
            name: radius,
            schema:
              { type: number, minimum: 100, maximum: 25000, default: 3500 },
          }
      responses:
        "200":
          description: Active nearby players, excluding the caller
          content:
            application/json:
              schema:
                type: object
                required: [players, expiresInSeconds]
                properties:
                  players:
                    type: array
                    items: { $ref: "#/components/schemas/NearbyPlayer" }
                  expiresInSeconds: { type: integer, example: 45 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /chat/messages:
    get:
      summary: Read a public, nearby, or two-person conversation
      description: >-
        Public rooms use bundled city/hotspot IDs. Nearby rooms require current
        presence in the requested area. The compatible direct:<peer UUID> room
        form uses the authenticated account's same private conversation as the
        dedicated direct endpoints and inbox; it cannot identify another pair.
      security: [{ session: [] }]
      parameters:
        - { in: query, name: room, required: true, schema: { type: string } }
        - {
            in: query,
            name: after,
            schema: { type: string, pattern: "^[0-9]+$" },
          }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 50, default: 50 },
          }
      responses:
        "200":
          description: Messages ordered by cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Send a message as the authenticated player
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [room, body, clientId]
              properties:
                room: { type: string }
                body: { type: string, minLength: 1, maxLength: 1000 }
                clientId: { type: string, format: uuid }
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: "#/components/schemas/ChatMessage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /chat/direct/messages:
    get:
      summary: Read the authenticated account's conversation with one peer
      description: >-
        Both participants must be active, adult-confirmed accounts. The viewer
        comes from the session, never from a query parameter. Without after,
        returns the newest window (50 messages by default) in ascending ID
        order; after retrieves newer messages. Each message uses room
        direct:<other account UUID>
        from the authenticated viewer's perspective. Legacy direct room
        requests use this same history.
      security: [{ session: [] }]
      parameters:
        - in: query
          name: peer
          required: true
          description: A different available account's UUID.
          schema: { $ref: "#/components/schemas/PeerId" }
        - in: query
          name: after
          description: >-
            Canonical decimal cursor from 0 through 9223372036854775807.
            Kept as a string to preserve 64-bit precision.
          schema: { type: string, pattern: "^(0|[1-9][0-9]{0,18})$" }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        "200":
          description: Participant-only messages ordered by forward cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Send a private message as the authenticated account
      description: >-
        The sender comes from the session. Both participants must be active,
        adult-confirmed accounts. Body is trimmed plain text, limited to 1000
        Unicode code points; tabs and line feeds are allowed, other control
        characters are rejected. JSON requests are limited to 16 KiB. An
        identical sender/clientId retry returns
        the stored message. Reusing that UUID with changed text or recipient
        returns 409. Public and private sends share a bounded account rate
        limit of 20 valid attempts per minute on this API instance.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectMessageInput" }
      responses:
        "200":
          description: Existing message returned for an identical retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessageResult" }
        "201":
          description: Private message created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessageResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /chat/direct/conversations:
    get:
      summary: List the authenticated account's private message inbox
      description: >-
        Returns at most 50 distinct available peers, newest latest-message ID
        first. Includes incoming and outgoing conversations, including legacy
        direct room history. No query parameters or viewer ID are accepted.
        Only the authenticated participant's conversations are returned;
        identities exclude email, roles and session data. No unread or read
        receipt state is implied.
      security: [{ session: [] }]
      responses:
        "200":
          description: Participant-only inbox, including an empty array
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectInbox" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: lv_session
  responses:
    Error:
      description: Stable error code
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  schemas:
    Register:
      type: object
      additionalProperties: false
      required: [handle, email, password, userType, adultConfirmed]
      properties:
        handle: { type: string, pattern: "^[a-z0-9_]{3,24}$" }
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 10, maxLength: 72 }
        userType: { type: string, enum: [tourist, local] }
        adultConfirmed: { type: boolean, const: true }
        appearance: { $ref: "#/components/schemas/Appearance" }
    Appearance:
      type: object
      additionalProperties: false
      required:
        [
          outfitStyle,
          topColor,
          bottomColor,
          hairStyle,
          hairColor,
          skinTone,
          shoeColor,
        ]
      properties:
        outfitStyle: { type: string, enum: [casual, jacket, dress, tourist] }
        topColor:
          {
            type: string,
            enum: ["#ece7df", "#687f73", "#b47459", "#777791", "#c19a4b"],
          }
        bottomColor:
          { type: string, enum: ["#34444f", "#4e504b", "#6b5147", "#30324a"] }
        hairStyle: { type: string, enum: [short, curly, bob, bun] }
        hairColor:
          { type: string, enum: ["#302823", "#6a4430", "#b98452", "#171719"] }
        skinTone:
          { type: string, enum: ["#5b3d30", "#76513b", "#a87955", "#d5af8b"] }
        shoeColor: { type: string, enum: ["#eee8df", "#5c4b42", "#292d31"] }
    Login:
      type: object
      additionalProperties: false
      required: [identity, password]
      properties:
        identity: { type: string }
        password: { type: string, maxLength: 72 }
    Presence:
      type: object
      additionalProperties: false
      required: [latitude, longitude, area]
      properties:
        latitude: { type: number, minimum: 38.683, maximum: 38.832 }
        longitude: { type: number, minimum: -9.435, maximum: -9.085 }
        area: { type: string, minLength: 1, maxLength: 80 }
        placeId:
          type: string
          maxLength: 145
          description: >-
            Optional canonical bundled public hotspot ID, including mapped
            source IDs and authored public hubs. Homes, arbitrary names and
            custom pins are rejected. Empty or omitted clears the public place
            while retaining the coarse in-world location. This is not device GPS.
    NearbyPlayer:
      type: object
      required:
        [
          id,
          handle,
          userType,
          latitude,
          longitude,
          area,
          distanceMetres,
          lastSeenAt,
          appearance,
        ]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        userType: { type: string, enum: [tourist, local] }
        latitude: { type: number }
        longitude: { type: number }
        area: { type: string }
        placeId:
          type: string
          minLength: 1
          maxLength: 145
          description: >-
            Canonical bundled public hotspot ID shared by this account; omitted
            outside a public place. It never identifies a private home or custom
            pin. Clients resolve this ID against the bundled public directory.
        distanceMetres: { type: integer, minimum: 0 }
        lastSeenAt: { type: string, format: date-time }
        appearance: { $ref: "#/components/schemas/Appearance" }
    User:
      type: object
      required:
        [
          id,
          handle,
          email,
          userType,
          accountStatus,
          preferredLocale,
          timezone,
          roles,
          appearance,
        ]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        email: { type: string, format: email }
        userType: { type: string, enum: [tourist, local] }
        accountStatus:
          { type: string, enum: [active, suspended, banned, deletion_pending] }
        preferredLocale: { type: string, enum: [en, pt-PT], default: en }
        timezone: { type: string }
        appearance: { $ref: "#/components/schemas/Appearance" }
        roles:
          type: array
          items: { type: string }
    ChatAuthor:
      type: object
      required: [id, handle, userType]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        userType: { type: string, enum: [tourist, local] }
    PeerId:
      type: string
      format: uuid
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      not: { const: "00000000-0000-0000-0000-000000000000" }
      description: Nonzero UUID of another eligible account; self is rejected.
    DirectMessageInput:
      type: object
      additionalProperties: false
      required: [recipientId, body, clientId]
      properties:
        recipientId: { $ref: "#/components/schemas/PeerId" }
        body: { type: string, minLength: 1, maxLength: 1000 }
        clientId:
          type: string
          format: uuid
          not: { const: "00000000-0000-0000-0000-000000000000" }
          description: >-
            Nonzero retry UUID scoped to the authenticated sender. Keep it for
            an uncertain send result; changed text or recipient needs a new UUID.
    ChatMessageResult:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { $ref: "#/components/schemas/ChatMessage" }
    DirectConversation:
      type: object
      additionalProperties: false
      required: [peer, lastMessage]
      properties:
        peer:
          $ref: "#/components/schemas/ChatAuthor"
          description: Public identity of the other participant.
        lastMessage:
          $ref: "#/components/schemas/ChatMessage"
          description: >-
            Latest message in this pair, with room direct:<peer UUID> from
            the authenticated viewer's perspective.
    DirectInbox:
      type: object
      additionalProperties: false
      required: [conversations]
      properties:
        conversations:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/DirectConversation" }
    ChatMessage:
      type: object
      required: [id, room, body, sentAt, author]
      properties:
        id: { type: string, pattern: "^[0-9]+$" }
        room:
          type: string
          description: Public room, nearby area, or direct peer identifier as requested by the caller.
        body: { type: string, minLength: 1, maxLength: 1000 }
        sentAt: { type: string, format: date-time }
        author: { $ref: "#/components/schemas/ChatAuthor" }
    ChatPage:
      type: object
      required: [messages, hasMore, nextCursor]
      properties:
        messages:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ChatMessage" }
        hasMore: { type: boolean }
        nextCursor: { type: [string, "null"], pattern: "^[0-9]+$" }
