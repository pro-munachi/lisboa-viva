openapi: 3.1.0
info:
  title: Lisboa Viva Account and Multiplayer API
  version: 0.2.0
servers:
  - url: /api
paths:
  /auth/register:
    post:
      summary: Create an adult tourist or local account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Register"
      responses:
        "201":
          description: Registered and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      summary: Create a session with handle/email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: Revoke the current session
      responses:
        "200":
          description: Signed out
  /auth/me:
    get:
      summary: Return the current account
      security: [{ session: [] }]
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Error" }
    patch:
      summary: Change user type or locale
      security: [{ session: [] }]
      responses:
        "200":
          description: Updated account
  /admin/users:
    get:
      summary: List account summaries
      security: [{ session: [] }]
      responses:
        "200": { description: Admin-authorized account list }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /multiplayer/presence:
    put:
      summary: Publish the current in-world player location
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Presence"
      responses:
        "200": { description: Presence heartbeat accepted }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      summary: Leave multiplayer presence
      security: [{ session: [] }]
      responses:
        "200": { description: Presence removed }
        "401": { $ref: "#/components/responses/Error" }
  /multiplayer/nearby:
    get:
      summary: List active players near an in-world coordinate
      security: [{ session: [] }]
      parameters:
        - {
            in: query,
            name: latitude,
            required: true,
            schema: { type: number },
          }
        - {
            in: query,
            name: longitude,
            required: true,
            schema: { type: number },
          }
        - {
            in: query,
            name: radius,
            schema:
              { type: number, minimum: 100, maximum: 25000, default: 3500 },
          }
      responses:
        "200":
          description: Active nearby players, excluding the caller
          content:
            application/json:
              schema:
                type: object
                required: [players, expiresInSeconds]
                properties:
                  players:
                    type: array
                    items: { $ref: "#/components/schemas/NearbyPlayer" }
                  expiresInSeconds: { type: integer, example: 45 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: lv_session
  responses:
    Error:
      description: Stable error code
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  schemas:
    Register:
      type: object
      additionalProperties: false
      required: [handle, email, password, userType, adultConfirmed]
      properties:
        handle: { type: string, pattern: "^[a-z0-9_]{3,24}$" }
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 10, maxLength: 72 }
        userType: { type: string, enum: [tourist, local] }
        adultConfirmed: { type: boolean, const: true }
    Login:
      type: object
      additionalProperties: false
      required: [identity, password]
      properties:
        identity: { type: string }
        password: { type: string, maxLength: 72 }
    Presence:
      type: object
      additionalProperties: false
      required: [latitude, longitude, area]
      properties:
        latitude: { type: number, minimum: 38.683, maximum: 38.832 }
        longitude: { type: number, minimum: -9.435, maximum: -9.085 }
        area: { type: string, minLength: 1, maxLength: 80 }
    NearbyPlayer:
      type: object
      required:
        [
          id,
          handle,
          userType,
          latitude,
          longitude,
          area,
          distanceMetres,
          lastSeenAt,
        ]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        userType: { type: string, enum: [tourist, local] }
        latitude: { type: number }
        longitude: { type: number }
        area: { type: string }
        distanceMetres: { type: integer, minimum: 0 }
        lastSeenAt: { type: string, format: date-time }
    User:
      type: object
      required:
        [
          id,
          handle,
          email,
          userType,
          accountStatus,
          preferredLocale,
          timezone,
          roles,
        ]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        email: { type: string, format: email }
        userType: { type: string, enum: [tourist, local] }
        accountStatus:
          { type: string, enum: [active, suspended, banned, deletion_pending] }
        preferredLocale: { type: string, enum: [en, pt-PT], default: en }
        timezone: { type: string }
        roles:
          type: array
          items: { type: string }
